<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="635" viewBox="0 0 1240 635"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a49ab8"/></marker></defs><rect width="100%" height="100%" fill="#100f16"/><text x="48" y="62" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="32">Build once / reuse a custom node</text><text x="48" y="96" fill="#a8a2b5" font-family="Arial, sans-serif" font-size="16">WORK IN PROGRESS · Local reusable groups · illustrative flow, not an application screenshot</text><rect x="48" y="155" width="250" height="100" rx="12" fill="#191820" stroke="#6892c0"/><text x="66" y="189" fill="#6892c0" font-family="Arial, sans-serif" font-size="21">Research</text><text x="66" y="223" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="14">Gather useful context</text><rect x="48" y="280" width="250" height="100" rx="12" fill="#191820" stroke="#9585d6"/><text x="66" y="314" fill="#9585d6" font-family="Arial, sans-serif" font-size="21">Plan</text><text x="66" y="348" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="14">Choose the next steps</text><rect x="48" y="405" width="250" height="100" rx="12" fill="#191820" stroke="#3fd082"/><text x="66" y="439" fill="#3fd082" font-family="Arial, sans-serif" font-size="21">Verify</text><text x="66" y="473" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="14">Check the outcome</text><path d="M298 330 L425 330" stroke="#a49ab8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="445" y="275" width="305" height="100" rx="12" fill="#191820" stroke="#ff8f9f"/><text x="463" y="309" fill="#ff8f9f" font-family="Arial, sans-serif" font-size="21">Save as custom node…</text><text x="463" y="343" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="14">Selection + internal connections</text><path d="M750 330 L865 330" stroke="#a49ab8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="885" y="275" width="290" height="100" rx="12" fill="#191820" stroke="#ff8f9f"/><text x="903" y="309" fill="#ff8f9f" font-family="Arial, sans-serif" font-size="21">Reusable group</text><text x="903" y="343" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="14">Add menu → another graph</text><text x="445" y="420" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="18">Fresh node IDs when inserted</text><text x="445" y="452" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="18">Model choices and prompts are copied</text><text x="445" y="484" fill="#e9e7ee" font-family="Arial, sans-serif" font-size="18">Notes and external connections are excluded</text><text x="48" y="585" fill="#a8a2b5" font-family="Arial, sans-serif" font-size="17">Custom nodes are stored locally. A dedicated cross-device sharing / import-export flow is not implemented.</text></svg>